apiVersion: v1
kind: ResourceQuota
metadata:
  name: model-serving-quota
  namespace: model-serving
spec:
  hard:
    requests.cpu: "64"
    requests.memory: "256Gi"
    requests.nvidia.com/gpu: "8"
    limits.cpu: "128"
    limits.memory: "512Gi"
    limits.nvidia.com/gpu: "8"
    pods: "16"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: model-serving-limits
  namespace: model-serving
spec:
  limits:
    - default:
        cpu: "16"
        memory: "64Gi"
      defaultRequest:
        cpu: "4"
        memory: "16Gi"
      type: Container
