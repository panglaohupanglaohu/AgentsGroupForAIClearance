apiVersion: v1
kind: Pod
metadata:
  name: model-inference-template
  namespace: model-serving
  labels:
    app.kubernetes.io/name: open-weights-inference
    app.kubernetes.io/component: model-inference
spec:
  automountServiceAccountToken: false
  hostNetwork: false
  hostPID: false
  hostIPC: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: inference-server
      image: registry.internal/ai/inference-base@sha256:4f8d9b6e12a4b5c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1
      imagePullPolicy: IfNotPresent
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        privileged: false
        capabilities:
          drop:
            - ALL
      env:
        - name: DISABLE_PROMPT_LOGGING
          value: "true"
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: TRANSFORMERS_OFFLINE
          value: "1"
        - name: MODEL_LOCKED_DIGEST
          value: "PLACEHOLDER_LOCKED_DIGEST"
      resources:
        limits:
          cpu: "16"
          memory: "64Gi"
          nvidia.com/gpu: "2"
        requests:
          cpu: "8"
          memory: "32Gi"
          nvidia.com/gpu: "2"
      volumeMounts:
        - name: model-weights
          mountPath: /models/weights
          readOnly: true
        - name: tmp-dir
          mountPath: /tmp
  volumes:
    - name: model-weights
      persistentVolumeClaim:
        claimName: pvc-model-weights
        readOnly: true
    - name: tmp-dir
      emptyDir: {}
